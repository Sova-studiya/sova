<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Абонемент — Совёнок</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: #F4F6F9;
      color: #18202B;
      text-align: center;
    }
    .card {
      background: #fff;
      border: 1px solid #E1E6ED;
      border-radius: 12px;
      padding: 24px 20px;
      max-width: 380px;
      width: 100%;
    }
    .title { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
    .hint { font-size: 14px; color: #4A5668; line-height: 1.45; margin: 0 0 18px; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      background: #1F4FD8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="title">Личный кабинет абонемента</p>
    <p class="hint">Нажмите кнопку ниже, чтобы открыть расписание и остаток занятий:</p>
    <form id="openForm" method="GET" action="https://script.google.com/macros/s/AKfycbzNnR9FnDW4DLd2jNt6dNS8MtSPpBj7XCzELfWkzDouCnWEBruIAQXxRY3KurtJsyRlbg/exec">
      <input type="hidden" name="token" id="tokenInput" value="">
      <button type="submit" class="btn">Открыть абонемент</button>
    </form>
  </div>

  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var token = (urlParams.get('token') || '').trim();
    document.getElementById('tokenInput').value = token;
  </script>
</body>
</html>
